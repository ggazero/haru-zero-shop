<main><div class="wrap">
  <h1>상품 사진 올리기</h1>
  <p id="photo-login" hidden>로그인한 뒤에 쓸 수 있습니다. <a href="login.html">로그인하기</a></p>
  <form id="photo-form" hidden>
    <p>
      <label for="photo-product">상품</label><br>
      <select id="photo-product" required disabled>
        <option value="">상품을 불러오는 중입니다</option>
      </select>
    </p>
    <p>
      <label for="photo-file">사진 파일</label><br>
      <input type="file" id="photo-file" accept="image/*" required>
    </p>
    <button type="submit" class="btn" id="photo-submit">사진 올리기</button>
    <p class="upload-result" id="photo-result" role="status"></p>
  </form>
</div></main>
