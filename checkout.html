<header class="site"><div class="wrap">
  <a class="brand" href="index.html">작은상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<main><div class="wrap">
  <h2>결제</h2>
  <p class="lead">연습용 화면입니다. 실제로 돈이 나가지 않습니다.</p>
  <form class="pay" id="pay-form">
    <label for="buyer">받는 분</label>
    <input id="buyer" name="buyer" required placeholder="이름">
    <label for="addr">주소</label>
    <input id="addr" name="addr" required placeholder="받으실 주소">
    <label for="phone">연락처</label>
    <input id="phone" name="phone" required placeholder="숫자만">
    <!-- 금액 요약: 장바구니 화면과 같은 표(table.cart)·합계(.total) 스타일을 그대로 씁니다.
         값은 app.js 가 채웁니다 -->
    <table class="cart">
      <tr><th scope="row">상품 금액</th><td><span id="pay-total">0원</span></td></tr>
      <tr><th scope="row">배송비</th><td id="pay-shipping">0원</td></tr>
      <!-- 무료배송 할인: 5만 원 미만이면 app.js 가 이 줄을 숨깁니다 -->
      <tr id="pay-discount-row" hidden><th scope="row">무료배송 할인</th><td id="pay-discount">0원</td></tr>
    </table>
    <div class="total">최종 결제 금액 <span id="pay-grand">0원</span></div>
    <p class="lead" id="pay-ship-note"></p>
    <button class="btn" type="submit">결제하기</button>
  </form>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
