<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 화면 · 작은상점</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
<style>
  /* 이 화면 전용 스타일 — 모두 ad- 접두사 */
  .ad-panel { max-width:520px; margin-top:20px; padding:22px 24px; background:var(--card);
    border:1px solid var(--line); border-top:4px solid #9ba078; border-radius:3px; box-shadow:3px 4px 0 #d6c6a42b; }
  .ad-panel[hidden], .ad-actions [hidden] { display:none; }
  .ad-state { margin:0 0 16px; font-size:17px; font-weight:600; overflow-wrap:anywhere; }
  .ad-info { margin:-6px 0 16px; font-size:14px; line-height:1.7; }
  .ad-info[hidden] { display:none; }
  .ad-info > div { display:flex; flex-wrap:wrap; gap:0 8px; }
  .ad-info dt { color:var(--sub); }
  .ad-info dt::after { content:" :"; }
  .ad-info dd { margin:0; overflow-wrap:anywhere; min-width:0; }
  .ad-actions { display:flex; flex-wrap:wrap; gap:10px; }
  .ad-actions .btn:disabled { opacity:.55; cursor:wait; }
  .ad-result { min-height:1.6em; margin:14px 0 0; font-size:13.5px; color:#9a3412; overflow-wrap:anywhere; }
  /* 상품 관리 */
  .ad-products { margin-top:28px; }
  .ad-products[hidden], .ad-new-form[hidden] { display:none; }
  .ad-products-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
  .ad-products-head h2 { margin:0; }
  .ad-new-form { max-width:520px; margin:16px 0 0; }
  .ad-new-form .ad-actions { margin-top:14px; }
  .ad-list-status { margin:14px 0 8px; color:var(--sub); font-size:13.5px; overflow-wrap:anywhere; }
  .ad-list-status:empty { display:none; }
  .ad-tools { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 18px; margin:18px 0 0; }
  .ad-filters { display:flex; flex-wrap:wrap; gap:6px; }
  .btn.ad-small[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .ad-tools label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--sub); }
  .ad-tools input, .ad-tools select { padding:7px 9px; border:1px solid var(--line); border-radius:3px; font:inherit;
    font-size:14px; color:var(--ink); background:#fffdf7; }
  .ad-tools input { width:min(220px, 70vw); }
  .ad-count { margin:12px 0 8px; font-size:14px; font-weight:600; }
  .ad-empty { color:var(--sub); text-align:center; }
  .ad-table-wrap { overflow-x:auto; }
  table.ad-table { width:100%; border-collapse:collapse; background:var(--card); font-size:14px; }
  table.ad-table th, table.ad-table td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:middle; }
  table.ad-table th { background:#ede2cd; white-space:nowrap; }
  table.ad-table td.ad-id { font-family:monospace; font-size:13px; white-space:nowrap; }
  table.ad-table td.ad-num { text-align:right; white-space:nowrap; }
  .ad-toggle { display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .btn.ad-small { padding:5px 12px; font-size:13px; white-space:nowrap; }
  .btn.ad-small:disabled { opacity:.55; cursor:wait; }
  .ad-msg { min-width:160px; font-size:13px; color:#9a3412; overflow-wrap:anywhere; }
  .ad-edit td { background:#f8f2e4; }
  table.ad-table td.ad-photo { width:56px; color:var(--sub); font-size:12px; overflow-wrap:anywhere; }
  .ad-thumb { display:block; width:48px; height:48px; object-fit:cover; border:1px solid var(--line); border-radius:3px; background:#fffdf7; }
  .ad-edit-fields input[type="file"], .ad-new-form input[type="file"] { padding:6px 0; border:0; background:none; font-size:13px; }
  .ad-edit-fields { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; }
  .ad-edit-fields label, .ad-new-form label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--sub); }
  .ad-edit-fields input { padding:7px 9px; border:1px solid var(--line); border-radius:3px; font:inherit; color:var(--ink); background:#fffdf7; }
  .ad-edit-fields input[name="summary"] { width:min(320px, 70vw); }
  .ad-edit-fields input[name="price"], .ad-edit-fields input[name="stock"] { width:110px; }
  .ad-new-form label { margin-top:12px; }
  .ad-new-form label:first-child { margin-top:0; }
  @media (max-width:480px) {
    .ad-panel { padding:18px; }
    .ad-actions .btn { flex:1 1 140px; text-align:center; }
  }
</style>
<!-- 동의 배너: 기본값 denied. 태그 관리자보다 먼저 -->

</head>
<body>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">작은상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>
<main><div class="wrap">
  <h1>관리 화면</h1>
  <section class="ad-panel" aria-live="polite">
    <p class="ad-state" id="ad-state" role="status">확인 중…</p>
    <dl class="ad-info" id="ad-info" hidden>
      <div><dt>로그인</dt><dd id="ad-email"></dd></div>
      <div><dt>토큰을 받은 시각</dt><dd id="ad-issued"></dd></div>
    </dl>
    <div class="ad-actions">
      <a class="btn" id="ad-login" href="login.html?next=admin.html" hidden>로그인</a>
      <button class="btn" id="ad-grant" type="button" hidden>주인 명찰 받기</button>
      <button class="btn ghost" id="ad-recheck" type="button" hidden>다시 확인</button>
    </div>
    <p class="ad-result" id="ad-result" role="alert"></p>
  </section>

  <!-- 상품 관리: role 이 staff / admin 일 때만 보인다 -->
  <section class="ad-products" id="ad-products" aria-labelledby="ad-products-title" hidden>
    <div class="ad-products-head">
      <h2 id="ad-products-title">상품 관리</h2>
      <button class="btn" id="ad-new" type="button">새 상품</button>
    </div>
    <form class="pay ad-new-form" id="ad-new-form" novalidate hidden>
      <label>상품명<input name="name" type="text" required></label>
      <label>가격<input name="price" type="number" min="1" step="any" inputmode="decimal" required></label>
      <label>한 줄 소개<input name="summary" type="text"></label>
      <label>재고<input name="stock" type="number" min="0" step="1" inputmode="numeric" required></label>
      <label>사진 (한 장, 5MB 미만 이미지)<input name="photo" type="file" accept="image/*"></label>
      <div class="ad-actions">
        <button class="btn" type="submit">만들기</button>
        <button class="btn ghost" id="ad-new-cancel" type="button">취소</button>
      </div>
      <p class="ad-result" id="ad-new-result" role="alert"></p>
    </form>
    <div class="ad-tools">
      <div class="ad-filters" role="group" aria-label="상품 거르기">
        <button class="btn ghost ad-small" type="button" data-filter="all" aria-pressed="true">전체</button>
        <button class="btn ghost ad-small" type="button" data-filter="soldout" aria-pressed="false">품절만</button>
        <button class="btn ghost ad-small" type="button" data-filter="hidden" aria-pressed="false">숨김만</button>
      </div>
      <label>이름 검색<input id="ad-search" type="search" autocomplete="off"></label>
      <label>정렬<select id="ad-sort">
        <option value="stock" selected>재고 적은 순</option>
        <option value="name">이름순</option>
      </select></label>
    </div>
    <p class="ad-list-status" id="ad-list-status" role="status"></p>
    <p class="ad-count" id="ad-count" role="status"></p>
    <div class="ad-table-wrap">
      <table class="ad-table">
        <thead>
          <tr><th>문서 ID</th><th>사진</th><th>상품명</th><th>가격</th><th>재고</th><th>품절</th><th>노출</th><th>고치기</th><th>결과</th></tr>
        </thead>
        <tbody id="ad-product-rows"></tbody>
      </table>
    </div>
  </section>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/auth-ui.js"></script>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
