<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 하루상점</title>
  <link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
  <style>
    .auth-actions { display:flex; flex-wrap:wrap; gap:12px; }
    .btn:disabled { opacity:.6; cursor:wait; }
    #auth-status { min-height:1.75em; margin:20px 0 0; overflow-wrap:anywhere; }
  </style>
<!-- 동의 배너: 기본값 denied. 태그 관리자보다 먼저 -->
<script src="assets/consent.js"></script>

<body>

  <header class="site"><div class="wrap">
    <a class="brand" href="index.html">하루상점</a>
    <nav class="site"><a href="index.html">상품</a></nav>
  </div></header>
  <main><div class="wrap">
    <h1>로그인</h1>
    <form class="pay" id="auth-form" novalidate>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="auth-actions">
        <button class="btn" id="signup" type="button">가입</button>
        <button class="btn" type="submit">로그인</button>
        <button class="btn ghost" id="logout" type="button">로그아웃</button>
      </div>
      <p><a href="#" id="forgot-password">비밀번호를 잊으셨나요?</a></p>
      <p><small>도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 작은상점을 다 보신 뒤 로그아웃을 눌러 주세요.</small></p>
      <p id="auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
  </div></main>
  <script type="module">
    import { auth, authReady, loginReturnPath, logoutToHome, sendVerificationEmail } from "./assets/auth.js";
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



    const returnPath = loginReturnPath();
    authReady.then(user => {
      if (user && returnPath) location.replace(returnPath);
    });
    const form = document.getElementById("auth-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("auth-status");
    const buttons = form.querySelectorAll("button");
    const authErrorMessages = {
      "auth/invalid-credential": "로그인이 어렵습니다. 이메일 또는 비밀번호를 다시 확인해 주세요.",
      "auth/email-already-in-use": "이미 우리 가게 회원이에요. 새로 가입하지 말고 로그인해 주세요.",
      "auth/weak-password": "비밀번호가 조금 짧아요. 6자 이상으로 다시 입력해 주세요.",
      "auth/invalid-email": "이메일 주소 형식을 확인해 주세요. @ 등이 빠지지 않았는지 확인해 주세요."
    };
    function authErrorMessage(error) {
      return authErrorMessages[error && error.code] || "문제가 생겼어요. 조금 뒤에 다시 시도해 주세요.";
    }

    async function runAuth(action, successMessage) {
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = "처리 중입니다.";
      try {
        await authReady;
        await action();
        password.value = "";
        status.textContent = successMessage;
        if (returnPath && auth.currentUser) location.replace(returnPath);
      } catch (error) {
        status.textContent = authErrorMessage(error);
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    document.getElementById("signup").addEventListener("click", () => {
      runAuth(
        async () => {
          await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ event: "sign_up", method: "email" });
          await sendVerificationEmail(auth.currentUser);
          status.textContent = "인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.";
          if (returnPath) await new Promise(resolve => setTimeout(resolve, 1500));
        },
        "인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요."
      );
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      runAuth(
        () => signInWithEmailAndPassword(auth, email.value.trim(), password.value),
        "로그인되었습니다."
      );
    });
    document.getElementById("logout").addEventListener("click", () => {
      runAuth(() => logoutToHome(), "로그아웃되었습니다.");
    });
    let resetting = false;
    document.getElementById("forgot-password").addEventListener("click", async event => {
      event.preventDefault();
      if (resetting) return;
      if (!email.value.trim() || !email.checkValidity()) {
        status.textContent = "이메일 칸에 가입한 주소를 입력한 뒤 다시 눌러 주세요.";
        email.focus();
        return;
      }
      resetting = true;
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = "처리 중입니다.";
      try {
        await sendPasswordResetEmail(auth, email.value.trim());
        status.textContent = "메일을 보냈습니다. 가입된 주소라면 곧 도착합니다.";
      } catch (error) {
        status.textContent = error.code === "auth/user-not-found"
          ? "메일을 보냈습니다. 가입된 주소라면 곧 도착합니다." : error.code;
      } finally {
        resetting = false;
        buttons.forEach(button => { button.disabled = false; });
      }
    });
  </script>
<script type="module" src="assets/auth-ui.js"></script>
</body>
</html>
