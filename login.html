<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 하루상점</title>
  <link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/auth.css">
  <style>
    .auth-actions { display:flex; flex-wrap:wrap; gap:12px; }
    .btn:disabled { opacity:.6; cursor:wait; }
    #auth-status { min-height:1.75em; margin:20px 0 0; overflow-wrap:anywhere; }
    .auth-divider { display:flex; align-items:center; gap:12px; margin:22px 0 18px; color:var(--sub); font-size:13px; }
    .auth-divider::before, .auth-divider::after { content:""; flex:1; border-top:1px solid var(--line); }
    .btn.google-login { display:flex; align-items:center; justify-content:center; gap:12px; width:100%;
      background:#fffdf7; color:var(--ink); }
    .btn.google-login svg { flex:none; width:20px; height:20px; }
    .login-panel { max-width:480px; padding:26px; background:var(--card); border:1px solid var(--line);
      border-top:4px solid #9ba078; border-radius:3px; box-shadow:3px 4px 0 #d6c6a42b; }
    .login-panel[hidden], #auth-form[hidden] { display:none; }
    .login-user { display:flex; align-items:center; gap:14px; min-width:0; }
    .login-user .account-avatar { width:56px; height:56px; font-size:24px; }
    .login-user h2 { margin:0; font-size:20px; overflow-wrap:anywhere; min-width:0; }
    .login-provider { display:inline-block; margin:16px 0 4px; padding:2px 12px; font-size:13px;
      color:var(--accent); background:#eef0e2; border:1px solid #c9ceb0; border-radius:999px; }
    #login-note { min-height:1.75em; margin:0 0 18px; overflow-wrap:anywhere; }
    @media (max-width:480px) {
      .login-panel { padding:20px; }
      .auth-actions .btn, .login-panel .auth-actions .btn { flex:1 1 120px; text-align:center; }
    }
  </style>
<!-- 동의 배너: 기본값 denied. 태그 관리자보다 먼저 -->
<script src="assets/consent.js"></script>

<body>

  <header class="site"><div class="wrap">
    <a class="brand" href="index.html">하루상점</a>
    <nav class="site"><a href="index.html">상품</a></nav>
  </div></header>
  <main><div class="wrap">
    <h1>로그인</h1>
    <form class="pay" id="auth-form" novalidate>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="auth-actions">
        <button class="btn" id="signup" type="button">가입</button>
        <button class="btn" type="submit">로그인</button>
      </div>
      <p><a href="#" id="forgot-password">비밀번호를 잊으셨나요?</a></p>
      <div class="auth-divider">또는</div>
      <button class="btn ghost google-login" id="google-login" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Google로 계속하기</span>
      </button>
      <p><small>도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 작은상점을 다 보신 뒤 로그아웃을 눌러 주세요.</small></p>
      <p id="auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
    <section class="login-panel" id="login-panel" hidden aria-labelledby="login-name">
      <div class="login-user" id="login-user"><h2 id="login-name"></h2></div>
      <p class="login-provider" id="login-provider"></p>
      <p id="login-note" role="status" aria-live="polite" aria-atomic="true"></p>
      <div class="auth-actions">
        <a class="btn" href="mypage.html">마이페이지</a>
        <button class="btn ghost" id="panel-logout" type="button">로그아웃</button>
      </div>
      <p><small>도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 작은상점을 다 보신 뒤 로그아웃을 눌러 주세요.</small></p>
    </section>
  </div></main>
  <script type="module">
    import { auth, authReady, subscribeAuth, loginReturnPath, logoutToHome, sendVerificationEmail } from "./assets/auth.js";
    import { profileAvatar, displayName } from "./assets/auth-ui.js";
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      signInWithPopup,
      GoogleAuthProvider
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



    const returnPath = loginReturnPath();
    authReady.then(user => {
      if (user && returnPath) location.replace(returnPath);
    });
    const form = document.getElementById("auth-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("auth-status");
    const buttons = form.querySelectorAll("button");
    const panel = document.getElementById("login-panel");
    const note = document.getElementById("login-note");
    const panelLogout = document.getElementById("panel-logout");
    // 성공 안내는 폼이 숨겨져도 보이도록 로그인 패널에도 같이 쓴다
    function say(message) {
      status.textContent = message;
      note.textContent = message;
    }
    subscribeAuth(user => {
      if (user && returnPath) return;
      form.hidden = !!user;
      panel.hidden = !user;
      if (!user) return;
      const isGoogle = user.providerData.some(profile => profile.providerId === "google.com");
      document.getElementById("login-name").textContent = `${displayName(user)}님, 환영합니다`;
      document.getElementById("login-user").replaceChildren(profileAvatar(user), document.getElementById("login-name"));
      document.getElementById("login-provider").textContent = isGoogle ? "Google 계정으로 로그인됨" : "이메일 계정으로 로그인됨";
    });
    panelLogout.addEventListener("click", async () => {
      panelLogout.disabled = true;
      try { await logoutToHome(); }
      catch (error) { panelLogout.disabled = false; note.textContent = authErrorMessage(error); }
    });
    const authErrorMessages = {
      "auth/invalid-credential": "로그인이 어렵습니다. 이메일 또는 비밀번호를 다시 확인해 주세요.",
      "auth/email-already-in-use": "이미 우리 가게 회원이에요. 새로 가입하지 말고 로그인해 주세요.",
      "auth/weak-password": "비밀번호가 조금 짧아요. 6자 이상으로 다시 입력해 주세요.",
      "auth/invalid-email": "이메일 주소 형식을 확인해 주세요. @ 등이 빠지지 않았는지 확인해 주세요.",
      "auth/popup-closed-by-user": "Google 로그인 창이 닫혔어요. 다시 눌러 주세요.",
      "auth/cancelled-popup-request": "Google 로그인 창이 닫혔어요. 다시 눌러 주세요.",
      "auth/popup-blocked": "브라우저가 팝업을 막았어요. 팝업을 허용한 뒤 다시 눌러 주세요.",
      "auth/account-exists-with-different-credential": "이 이메일은 이미 비밀번호로 가입되어 있어요. 이메일과 비밀번호로 로그인해 주세요."
    };
    function authErrorMessage(error) {
      return authErrorMessages[error && error.code] || "문제가 생겼어요. 조금 뒤에 다시 시도해 주세요.";
    }

    async function runAuth(action, successMessage) {
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = "처리 중입니다.";
      try {
        await authReady;
        await action();
        password.value = "";
        say(successMessage);
        if (returnPath && auth.currentUser) location.replace(returnPath);
      } catch (error) {
        status.textContent = authErrorMessage(error);
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    document.getElementById("signup").addEventListener("click", () => {
      runAuth(
        async () => {
          await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ event: "sign_up", method: "email" });
          await sendVerificationEmail(auth.currentUser);
          say("인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.");
          if (returnPath) await new Promise(resolve => setTimeout(resolve, 1500));
        },
        "인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요."
      );
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      runAuth(
        () => signInWithEmailAndPassword(auth, email.value.trim(), password.value),
        "로그인되었습니다."
      );
    });
    document.getElementById("google-login").addEventListener("click", async () => {
      // 팝업이 막히지 않도록 클릭 직후 바로 연다
      const popup = signInWithPopup(auth, new GoogleAuthProvider());
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = "처리 중입니다.";
      try {
        const { user } = await popup;
        say(`${displayName(user)}님, 로그인되었습니다.`);
        if (returnPath) location.replace(returnPath);
      } catch (error) {
        status.textContent = authErrorMessage(error);
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    });
    let resetting = false;
    document.getElementById("forgot-password").addEventListener("click", async event => {
      event.preventDefault();
      if (resetting) return;
      if (!email.value.trim() || !email.checkValidity()) {
        status.textContent = "이메일 칸에 가입한 주소를 입력한 뒤 다시 눌러 주세요.";
        email.focus();
        return;
      }
      resetting = true;
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = "처리 중입니다.";
      try {
        await sendPasswordResetEmail(auth, email.value.trim());
        status.textContent = "메일을 보냈습니다. 가입된 주소라면 곧 도착합니다.";
      } catch (error) {
        status.textContent = error.code === "auth/user-not-found"
          ? "메일을 보냈습니다. 가입된 주소라면 곧 도착합니다." : error.code;
      } finally {
        resetting = false;
        buttons.forEach(button => { button.disabled = false; });
      }
    });
  </script>
<script type="module" src="assets/auth-ui.js"></script>
</body>
</html>
