<link rel="stylesheet" href="assets/auth.css">

    .auth-actions { display:flex; flex-wrap:wrap; gap:12px; }
    .btn:disabled { opacity:.6; cursor:wait; }
    #auth-status { min-height:1.75em; margin:20px 0 0; overflow-wrap:anywhere; }
  </style>
<!-- 동의 배너: 기본값 denied. 태그 관리자보다 먼저 -->

  <header class="site"><div class="wrap">
    <a class="brand" href="index.html">하루상점</a>
    <nav class="site"><a href="index.html">상품</a></nav>
  </div></header>
  <main><div class="wrap">
    <h1>로그인</h1>
    <form class="pay" id="auth-form" novalidate>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="auth-actions">
        <button class="btn" id="signup" type="button">가입</button>
        <button class="btn" type="submit">로그인</button>
        <button class="btn ghost" id="logout" type="button">로그아웃</button>
      </div>
      <p><small>도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, 작은상점을 다 보신 뒤 로그아웃을 눌러 주세요.</small></p>
      <p id="auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
  </div></main>
  <script type="module">
    import { auth, authReady, loginReturnPath, logoutToHome } from "./assets/auth.js";
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



    const returnPath = loginReturnPath();
    authReady.then(user => {
      if (user && returnPath) location.replace(returnPath);
    });
    const form = document.getElementById("auth-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("auth-status");
    const buttons = form.querySelectorAll("button");

    async function runAuth(action, successMessage) {
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = "처리 중입니다.";
      try {
        await authReady;
        await action();
        password.value = "";
        status.textContent = successMessage;
        if (returnPath && auth.currentUser) location.replace(returnPath);
      } catch (error) {
        status.textContent = error.code;
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    document.getElementById("signup").addEventListener("click", () => {
      runAuth(
        async () => {
          await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ event: "sign_up", method: "email" });
        },
        "가입이 완료되어 로그인되었습니다."
      );
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      runAuth(
        () => signInWithEmailAndPassword(auth, email.value.trim(), password.value),
        "로그인되었습니다."
      );
    });
    document.getElementById("logout").addEventListener("click", () => {
      runAuth(() => logoutToHome(), "로그아웃되었습니다.");
    });
  </script>
<script type="module" src="assets/auth-ui.js"></script>
</body>
</html>
